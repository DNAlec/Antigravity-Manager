name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to publish (empty uses package.json)'
        required: false
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Serialize publishing so two runs cannot race over latest.
concurrency:
  group: docker-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      image: ${{ steps.release.outputs.image }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag, version and release channel
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              tag="$GITHUB_REF_NAME"
            else
              tag="v$(jq -r .version package.json)"
            fi
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] || { echo 'Invalid release tag'; exit 1; }
          sha=$(git rev-parse --verify "refs/tags/$tag^{commit}")
          version=$(git show "$sha:package.json" | jq -r .version)
          [ "$tag" = "v$version" ] || { echo 'Tag/package version mismatch'; exit 1; }
          channel=main
          prerelease=false
          if [[ "$tag" == *-beta.* ]]; then channel=beta; prerelease=true; fi
          git merge-base --is-ancestor "$sha" "origin/$channel" || { echo "Tag is not on $channel"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "image=$image"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Docker (${{ matrix.arch }})
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      ARCH: ${{ matrix.arch }}
    steps:
      # Keep deployment templates from the workflow revision, even when re-publishing an older tag.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: source
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native image
        uses: docker/build-push-action@v6
        with:
          context: source
          file: source/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}-${{ matrix.arch }}
          build-args: USE_MIRROR=false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: Smoke-test Compose startup and health
        env:
          AM_IMAGE: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}-${{ matrix.arch }}
          ABV_HOST_DATA_DIR: ${{ runner.temp }}/am-smoke-data
          API_KEY: ci-smoke-api-key
          WEB_PASSWORD: ci-smoke-web-password
        run: |
          mkdir -p "$ABV_HOST_DATA_DIR"
          docker compose -p release-smoke -f docker/compose.release.yml up -d --wait --wait-timeout 120
          curl --fail --max-time 10 http://127.0.0.1:8045/health
      - name: Push tested image and record digest
        run: |
          docker push "$IMAGE:$RELEASE_TAG-$ARCH"
          mkdir -p digests
          docker image inspect "$IMAGE:$RELEASE_TAG-$ARCH" --format '{{index .RepoDigests 0}}' > "digests/$ARCH.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*.txt
          if-no-files-found: error
      - name: Smoke-test logs and cleanup
        if: always()
        env:
          AM_IMAGE: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}-${{ matrix.arch }}
          ABV_HOST_DATA_DIR: ${{ runner.temp }}/am-smoke-data
          API_KEY: ci-smoke-api-key
          WEB_PASSWORD: ci-smoke-web-password
        run: |
          docker compose -p release-smoke -f docker/compose.release.yml logs --tail=80
          docker compose -p release-smoke -f docker/compose.release.yml down

  publish:
    name: Publish Docker and Compose release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE: ${{ needs.prepare.outputs.image }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture version
        run: |
          docker buildx imagetools create --tag "$IMAGE:$RELEASE_TAG" \
            "$(cat digests/amd64.txt)" "$(cat digests/arm64.txt)"
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG"
      - name: Prepare version-pinned Compose assets and notes
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          mkdir -p release-assets
          cp docker/compose.release.yml release-assets/compose.yml
          cp docker/release.env.example release-assets/.env.example
          sed -i "s|ghcr.io/dnalec/antigravity-manager:latest|$IMAGE:$RELEASE_TAG|g" release-assets/compose.yml release-assets/.env.example
          git show "$SOURCE_SHA:CHANGELOG.md" > /tmp/release-changelog.md
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path('/tmp/release-changelog.md').read_text()
          tag = os.environ['RELEASE_TAG']
          match = re.search(r'^    \*   \*\*' + re.escape(tag) + r' \([^\n]+\n(.*?)(?=^    \*   \*\*v|\Z)', text, re.M | re.S)
          if not match:
              raise SystemExit('Missing release changelog section')
          pathlib.Path('release-notes.md').write_text(match[1].strip() + '\n\n## Docker Compose\n\n'
              + 'Image: `' + os.environ['IMAGE'] + ':' + tag + '` (Linux AMD64 / ARM64).\n\n'
              + 'Download `compose.yml` and `.env.example`, copy `.env.example` to `.env`, set credentials and the existing data directory, then run:\n\n'
              + '```sh\ndocker compose pull\ndocker compose up -d --wait --wait-timeout 120\n```\n\n'
              + 'Private GHCR packages require `docker login ghcr.io` with a token that has `read:packages`. No desktop installers or automatic desktop updater manifest are published.\n')
          PY
      - name: Publish release and stable alias
        run: |
          set -euo pipefail
          # Rebuilding an older version must not roll latest backward.
          make_latest=false
          if [ "$IS_PRERELEASE" = false ]; then
            if ! latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2> /tmp/latest-release-error); then
              if grep -q '(HTTP 404)' /tmp/latest-release-error; then
                latest=''
              else
                cat /tmp/latest-release-error >&2
                exit 1
              fi
            fi
            if [ -z "$latest" ] || [ "$(printf '%s\n' "$latest" "$RELEASE_TAG" | sort -V | tail -1)" = "$RELEASE_TAG" ]; then
              make_latest=true
            fi
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/compose.yml release-assets/.env.example --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md --prerelease="$IS_PRERELEASE" --latest="$make_latest" --repo "$GITHUB_REPOSITORY"
          else
            args=()
            if [ "$IS_PRERELEASE" = true ]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" release-assets/compose.yml release-assets/.env.example \
              --verify-tag --title "Antigravity Manager $RELEASE_TAG (Docker Compose)" \
              --notes-file release-notes.md --latest="$make_latest" "${args[@]}" --repo "$GITHUB_REPOSITORY"
          fi
          # Advance the image alias only after the GitHub publication succeeds.
          if [ "$make_latest" = true ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$RELEASE_TAG"
          fi
